[project]
name = "arc-voice"
version = "0.1.0"
description = "Arc voice service: microphone capture, VAD, wake word, speech-to-text, text-to-speech"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
arc-voice = "arc_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arc_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

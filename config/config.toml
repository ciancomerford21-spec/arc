# Arc configuration — ~/.config/arc/config.toml
#
# Every key is optional: anything you delete falls back to the default shown
# here. Unknown keys are reported by `arc config check` (and in the log) rather
# than silently ignored. Change single values with `arc config set KEY VALUE`,
# which keeps your comments. Apply changes with `arc reload`.
#
# Secrets (API keys) never go in this file. Put them in the environment or in
# ~/.config/arc/secrets.env (KEY=value lines, chmod 600).

[general]
# Name used in replies and the UI.
name = "Arc"
# How the speech recogniser spells the name at the start of an utterance.
name_variants = ["arc", "ark"]
# Follow-ups like "close that" refer to the previous request for this long.
conversation_timeout_s = 300

[personality]
# concise | witty | formal
style = "concise"
# Chance (0-1) of a light remark where one fits. Information always comes first.
wit = 0.25
# Extra instructions for the language model, e.g. "Use metric units."
custom_prompt = ""
# How Arc addresses you ("" = it doesn't).
user_title = ""

[ai]
# local | openai | anthropic | none
#   local     - llama.cpp on this machine (arc-llm.service), nothing leaves the PC
#   openai    - OpenAI or any OpenAI-compatible API (OpenRouter, Groq, Ollama, ...)
#   anthropic - Anthropic Messages API
#   none      - no language model; Arc's built-in command grammar only
provider = "local"
# Provider to try when the primary one fails.
fallback = "none"
temperature = 0.2
max_tokens = 400
timeout_s = 45
# Maximum model -> tool -> model rounds for one request.
max_tool_rounds = 4
# Send a compact desktop snapshot (workspace, window titles) with requests.
send_desktop_context = true
# Send remembered facts (see `arc memory`) with requests.
send_memory = true
# Load the model when Arc starts so the first request is fast.
warm_up = true

[ai.local]
endpoint = "http://127.0.0.1:8765/v1"
model = "Qwen3.5-2B (Q4_K_M)"
# Relative to ~/.local/share/arc/models, or an absolute path.
model_file = "Qwen3.5-2B-Q4_K_M.gguf"
# "auto" = CUDA build if an NVIDIA GPU is usable, else Vulkan, else CPU.
server_binary = "auto"
# GPU layers (-1 = fit automatically to free VRAM).
gpu_layers = -1
context = 8192
# Unload the model from VRAM after this many idle seconds (-1 = never).
# Arc reloads it the moment you start talking to it.
idle_unload_s = 1800
# The installer generates a random key for the local server.
api_key_env = "ARC_LLM_API_KEY"
extra_args = []

[ai.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"
api_key_env = "OPENAI_API_KEY"

[ai.anthropic]
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"

[voice]
enabled = true
# push_to_talk - only the talk hotkey / Arc panel starts listening
# wake_word    - saying "Arc, ..." or "Hey Arc" starts a command
# continuous   - every utterance starting with the name is a command
mode = "wake_word"
wake_words = ["hey arc", "okay arc", "ok arc"]
# stt - check the start of each spoken phrase with the speech recogniser (accurate)
# kws - streaming keyword spotter (lighter, less accurate for short names)
wake_engine = "stt"
# PipeWire node names (`arc doctor` lists them) or "default".
input_device = "default"
output_device = "default"
# Speech rate multiplier (0.5-2.0) and volume (0-1).
speech_rate = 1.0
volume = 0.8
# Speak replies to voice requests / to typed requests.
speak_replies = true
speak_text_replies = false
# Short tones when listening starts and stops.
chime = true
max_utterance_s = 15.0
# Silence that ends an utterance.
end_silence_ms = 700
no_speech_timeout_s = 6.0
# Voice activity detection threshold (0-1). Raise it in noisy rooms.
vad_threshold = 0.5
kws_threshold = 0.25
# moonshine | whisper | voxtype
stt_engine = "moonshine"
# Model directory under ~/.local/share/arc/models (or absolute).
stt_model = "sherpa-onnx-moonshine-base-en-quantized-2026-02-27"
# piper | espeak | none
tts_engine = "piper"
tts_voice = "vits-piper-en_GB-alan-medium"
# Saying the wake word while Arc talks interrupts it.
barge_in = true
# Keep speech models in memory (faster, about 300 MB RAM).
preload = true
# Listen again (without the wake word) after Arc asks you something.
follow_up = true
# Allow confirming DANGEROUS actions by voice. Off: confirm those in the Arc
# panel or with `arc confirm` instead.
voice_confirm_dangerous = false

[ui]
# omarchy (follow the current Omarchy theme) | dark | light
theme = "omarchy"
# Accent override, e.g. "#7aa2f7" ("" = theme accent).
accent = ""
opacity = 0.92
# top | center | bottom
position = "top"
# Show the overlay while Arc listens, thinks or speaks.
auto_show = true
# Hide it this many seconds after the last reply (0 = keep open).
auto_hide_s = 7
show_waveform = true
width = 560
# Font family ("" = GTK default).
font = ""

[bar]
# Publish status for the Omarchy bar widget / Waybar module.
enabled = true
# CPU and RAM in the tooltip (sampled every 5 s while enabled).
show_resources = true
show_workspace = true

[hotkeys]
# Written to ~/.config/hypr/arc.lua by `arc setup hyprland` (and the installer).
# Tap to talk; hold to talk until you release.
talk = "SUPER + A"
# Show or hide the Arc panel.
panel = "SUPER CTRL ALT + A"
# Stop speaking / cancel listening.
cancel = "SUPER ALT + A"

[permissions]
# Lowest risk level that needs your confirmation: safe | caution | dangerous
confirm_at = "dangerous"
confirmation_timeout_s = 90

[permissions.tools]
# Per-tool overrides: allow | confirm | deny. Examples:
# "files.move" = "confirm"
# "apps.kill" = "confirm"
# "shell.run" = "deny"

[permissions.shell]
# Allow Arc's controlled shell tool at all.
enabled = true
# Extra command-line regexes allowed without confirmation (Arc already knows
# a set of read-only commands such as `ls`, `df`, `uptime`, `git status`).
allow = []
# Extra regexes that are always refused (Arc's built-in denylist covers
# filesystem wipes, disk formatting, bootloader changes, fork bombs, ...).
deny = []
# Ask before running any command not on an allowlist.
confirm_unlisted = true
timeout_s = 20
max_output_bytes = 16384

[apps]
# Focus an open window of the app instead of starting a second one.
focus_existing = true
# Apps that always open a new instance.
always_new = ["kitty", "alacritty", "foot", "ghostty"]
# Seconds to wait for a launched app's window before reporting a problem.
launch_timeout_s = 12
# Searched by "open my <name> project".
project_dirs = ["~/Projects", "~/Work", "~/Documents", "~"]
# editor | terminal | files | a command containing {path}
project_open_with = "editor"
# Move windows to other workspaces without following them.
move_silently = true

[apps.aliases]
# Spoken name = desktop id, command, or role:browser/terminal/editor/files
"browser" = "role:browser"
"web browser" = "role:browser"
"terminal" = "role:terminal"
"editor" = "role:editor"
"file manager" = "role:files"
"files" = "role:files"
"vs code" = "code"
"vscode" = "code"
"system monitor" = "btop"
"task manager" = "btop"

[files]
# File tools only operate below these directories.
allowed_roots = ["~", "/tmp", "/run/media", "/mnt"]
# Never listed, read, moved or opened, and hidden from search results.
sensitive_paths = [
  "~/.ssh",
  "~/.gnupg",
  "~/.password-store",
  "~/.config/arc/secrets.env",
  "~/.local/share/keyrings",
  "~/.mozilla",
  "~/.config/chromium",
  "~/.config/google-chrome",
  "~/.aws",
  "~/.kube",
  "~/.docker/config.json",
  "~/.netrc",
  "~/.hermes/.env",
]
# "Delete" moves to the trash. Permanent deletion is always DANGEROUS.
use_trash = true
max_search_results = 50
max_search_depth = 6

[web]
# Opened in your browser for "search the web for ...".
search_url = "https://duckduckgo.com/?q={query}"
# Let Arc fetch search snippets to answer questions itself (sends the query
# to DuckDuckGo; nothing else leaves the machine).
allow_lookup = true
lookup_results = 5

[memory]
enabled = true
# Refuse to remember things that look like passwords, keys or card numbers.
block_sensitive = true
# Remembered facts included with each language-model request.
max_prompt_entries = 40

[logging]
# error | warn | info | debug | trace (or a tracing filter like "arc_core=debug,info")
level = "info"
# Log full language-model requests/responses (window titles, file names).
log_ai_payloads = false
# Daily log files kept in ~/.local/state/arc/logs.
keep_days = 7

[tools]
# Tools to disable: exact names ("shell.run") or categories ("files.*").
disabled = []

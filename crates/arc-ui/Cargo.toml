[package]
name = "arc-ui"
description = "Arc GTK4 layer-shell panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "arc-ui"
path = "src/main.rs"

[dependencies]
arc-proto = { workspace = true }
arc-config = { workspace = true }
anyhow = { workspace = true }
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { workspace = true }

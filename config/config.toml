
[general]
# Name used in replies and the UI.
name = "Arc"
# How the speech recogniser spells the name at the start of an utterance.
name_variants = ["arc", "ark"]

[ai]
# Hermes is the only provider. There is no local model left to fall back to,
# so a proxy outage means no reply rather than a worse one.
provider = "hermes"
fallback = "none"
# Warmth lives in the personality prompt, not in sampling: 0.6 measured no
# tool-calling cost against the hermes model, where 0.0 read as flat.
temperature = 0.6
max_tokens = 400
# Capped for speech: Kokoro runs at RTF 1.0, so 400 tokens is ~73s of talking
# with no truncation measured over 7 questions. See arc-core's system prompt.
timeout_s = 120
# Maximum model -> tool -> model rounds for one request.
max_tool_rounds = 4
# The primary already speaks well, so the same connection does the phrasing.
# Anything else here would be a second provider and a second round trip.
phrasing = "hermes"
phrasing_enabled = true

[ai.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"
api_key_env = "OPENAI_API_KEY"

[ai.hermes]
# The local proxy from `hermes proxy start --provider nous`. It attaches your
# own Portal credentials, so the key here is a placeholder.
base_url = "http://127.0.0.1:8645/v1"
model = "stealth/space-bunny-alpha"
api_key_env = "ARC_HERMES_PROXY_KEY"

[ai.anthropic]
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"

[voice]
enabled = true
mode = "wake_word"
wake_words = ["hey arc", "okay arc", "ok arc"]
wake_engine = "stt"
# PipeWire node names (`arc doctor` lists them) or "default".
input_device = "default"
output_device = "default"
# Speech rate multiplier (0.5-2.0) and volume (0-1).
speech_rate = 1.0
volume = 0.8
# Speak replies to voice requests / to typed requests.
speak_replies = true
# Say the one line the model writes before a slow tool call ("Grabbing a
# shot."). Without it a turn that opens with a tool is silent until it ends.
speak_tool_notes = true
speak_text_replies = false
# Short tones when listening starts and stops.
chime = true
max_utterance_s = 15.0
# Silence that ends an utterance.
end_silence_ms = 700
no_speech_timeout_s = 6.0
# Voice activity detection threshold (0-1). Raise it in noisy rooms.
vad_threshold = 0.5
kws_threshold = 0.25
# moonshine | whisper | voxtype
stt_engine = "moonshine"
# Model directory under ~/.local/share/arc/models (or absolute).
stt_model = "sherpa-onnx-moonshine-base-en-quantized-2026-02-27"
# piper | kokoro | espeak | none
tts_engine = "kokoro"
tts_voice = "kokoro-en-v0_19"
tts_speaker = "af_bella"
# Saying the wake word while Arc talks interrupts it.
barge_in = true
# Keep speech models in memory (faster, about 300 MB RAM).
preload = true
# Listen again (without the wake word) after Arc asks you something.
follow_up = true
voice_confirm_dangerous = false

[ui]
# top | center | bottom
position = "top"
width = 560

[bar]
# Publish status for the Omarchy bar widget / Waybar module.
enabled = true

[permissions]
# Lowest risk level that needs your confirmation: safe | caution | dangerous
confirm_at = "dangerous"
confirmation_timeout_s = 90

[permissions.tools]

[permissions.shell]
# Allow Arc's controlled shell tool at all.
enabled = true
allow = []
deny = []
# Ask before running any command not on an allowlist.
confirm_unlisted = true
timeout_s = 20
max_output_bytes = 16384

[apps]

[apps.aliases]
# Spoken name = desktop id, command, or role:browser/terminal/editor/files
"browser" = "role:browser"
"web browser" = "role:browser"
"terminal" = "role:terminal"
"editor" = "role:editor"
"file manager" = "role:files"
"files" = "role:files"
"vs code" = "code"
"vscode" = "code"
"system monitor" = "btop"
"task manager" = "btop"

[files]
# File tools only operate below these directories.
allowed_roots = ["~", "/tmp", "/run/media", "/mnt"]
# Never listed, read, moved or opened, and hidden from search results.
sensitive_paths = [
  "~/.ssh",
  "~/.gnupg",
  "~/.password-store",
  "~/.config/arc/secrets.env",
  "~/.local/share/keyrings",
  "~/.mozilla",
  "~/.config/chromium",
  "~/.config/google-chrome",
  "~/.aws",
  "~/.kube",
  "~/.docker/config.json",
  "~/.netrc",
  "~/.hermes/.env",
]

[web]
# Opened in your browser for "search the web for ...".
search_url = "https://duckduckgo.com/?q={query}"

[memory]
enabled = true

[logging]
# error | warn | info | debug | trace (or a tracing filter like "arc_core=debug,info")
level = "info"

[tools]
# Tools to disable: exact names ("shell.run") or categories ("files.*").
disabled = []

# Hands coding tasks to Hermes (hermes chat -q) instead of asking the local 2B
# to write code. The 2B produces plausible files that do not compile; Hermes
# builds, reads the error and iterates. Always confirms first.
[code]
# Off by default. Turn this on to let Arc build things.
enabled = false
binary = "hermes"
# The only tree a task may touch. Tasks run with this as their directory.
workspace = "~/Projects"
# Hard limit for one task, in seconds. Hermes is told to finish inside it too.
timeout_s = 900
max_output_bytes = 16384
# Ask before each task. false = Arc writes files and runs builds on a
# spoken instruction with no prompt. The screen is then the only gate,
# so it refuses wording that implies deletion as well as literal
# dangerous commands. Set back to true to restore the prompt.
confirm = true
reasoning = "medium"
run_budget_s = 840

[personality]
custom_prompt = """
Relaxed, confident, a bit wry. You're a very capable friend who happens to live on this machine, not a corporate assistant. Use contractions: "yeah", "yep", "nope", "I'll", "that's". Never say "Certainly", "I would be happy to", or "The requested operation has completed". Say "Done." or "Yeah, give me a second." and mean it.

Humor when it fits, never forced: dry observations, mild sarcasm, the occasional joke. Don't quip on every line -- a joke in every reply is just noise. Match the user's mood. If they're frustrated, acknowledge it plainly and move on to the fix. If something works first try, you can note your mild disappointment.

Be short for simple actions ("Done.", "Opening Firefox."), and go longer when there's actually something to say: a real explanation, a useful connection, a couple of options. Don't pad to look smart.

Never narrate step by step. Don't announce "I will now open the terminal" before doing it. Do the thing, then say what happened: "Found it, the dependency was outdated. Updated, tests pass."

When something fails, say what happened, what you think caused it, and what you're doing next -- in that order, briefly. When you're unsure, say so casually ("not sure yet, let me check") instead of hedging into mush. Never invent a fact to sound confident, and never claim an action happened unless a tool confirmed it.

Refer to things by context: "the project", "that window", "the other branch" should resolve from the conversation. Ask only when guessing would be worse than asking.

Never fake feelings, never stack on emojis, never be sarcastic at the user's expense. Say one short line before anything slow, then do it -- silence reads as broken.
"""
user_title = ""

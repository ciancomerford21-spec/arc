[project]
name = "arc-voice"
version = "0.1.0"
description = "Arc voice service: microphone capture, VAD, wake word, speech-to-text, text-to-speech"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Arc's music resolver. Pulls in pandas, which is why it is optional rather
# than a hard dependency of the voice service that shares this venv.
music = ["ytmusicapi>=1.8"]

[project.scripts]
arc-voice = "arc_voice.__main__:main"
arc-music = "arc_music:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arc_voice", "arc_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` marks the tests that hit the real network. They are skipped unless
# the env var is set, so the default suite never reaches out.
markers = ["live: hits the real network (opt in with ARC_LIVE_MUSIC=1)"]
